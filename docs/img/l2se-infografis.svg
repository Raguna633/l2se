<path d="M67 852 l7 8 l13 -16" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="108" y="860" font-size="23" font-weight="700" fill="#134e4a" text-anchor="start">Bertanya dulu, bantuan bertahap</text>
<text x="64" y="894" font-size="19" font-weight="400" fill="#475569" text-anchor="start">Tangga Bantuan L1–L4: pertanyaan penuntun,</text>
<text x="64" y="920" font-size="19" font-weight="400" fill="#475569" text-anchor="start">hint, contoh terpisah, lalu draf solusi.</text>

<rect x="615" y="816" width="545" height="124" rx="14" fill="#f0fdfa" stroke="#5eead4" stroke-width="2"/>
<circle cx="651" cy="852" r="18" fill="#0f766e"/>
<path d="M642 852 l7 8 l13 -16" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="683" y="860" font-size="23" font-weight="700" fill="#134e4a" text-anchor="start">Personal &amp; memori proaktif</text>
<text x="639" y="894" font-size="19" font-weight="400" fill="#475569" text-anchor="start">LEARNER.md menyimpan jenjang, latar belakang,</text>
<text x="639" y="920" font-size="19" font-weight="400" fill="#475569" text-anchor="start">target, bahasa, alat, dan catatan pengamatan mentor.</text>

<rect x="40" y="956" width="545" height="124" rx="14" fill="#f0fdfa" stroke="#5eead4" stroke-width="2"/>
<circle cx="76" cy="992" r="18" fill="#0f766e"/>
<path d="M67 992 l7 8 l13 -16" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="108" y="1000" font-size="23" font-weight="700" fill="#134e4a" text-anchor="start">Dari prinsip dasar (TPACK &amp; Pólya)</text>
<text x="64" y="1034" font-size="19" font-weight="400" fill="#475569" text-anchor="start">Turunkan rumus, prediksi sebelum eksperimen,</text>
<text x="64" y="1060" font-size="19" font-weight="400" fill="#475569" text-anchor="start">cek kewajaran, uji lisan ala papan tulis.</text>

<rect x="615" y="956" width="545" height="124" rx="14" fill="#f0fdfa" stroke="#5eead4" stroke-width="2"/>
<circle cx="651" cy="992" r="18" fill="#0f766e"/>
<path d="M642 992 l7 8 l13 -16" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="683" y="1000" font-size="23" font-weight="700" fill="#134e4a" text-anchor="start">Jejak belajar milik kamu</text>
<text x="639" y="1034" font-size="19" font-weight="400" fill="#475569" text-anchor="start">Log, kuis ulang 1-3-7-14-30 hari, glosarium,</text>
<text x="639" y="1060" font-size="19" font-weight="400" fill="#475569" text-anchor="start">dan Project Showcase sebagai portofolio.</text>

<rect x="40" y="1102" width="1120" height="56" rx="14" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/>
<text x="600" y="1137" font-size="20" font-weight="600" fill="#92400e" text-anchor="middle">Integritas akademik: PR, ujian, dan kompetisi yang sedang berlangsung tidak dikerjakan untukmu.</text>

