<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1830" width="1200" height="1830" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Infografis L2SE — Learner to Systems Engineer</title>
<desc id="d">Ringkasan masalah yang diselesaikan L2SE, cara L2SE menjawabnya, tiga langkah memulai, alur satu sesi belajar, dan untuk siapa framework ini.</desc>
<rect width="1200" height="1830" fill="#f8fafc"/>
<rect width="1200" height="210" fill="#1e3a8a"/>
<text x="60" y="100" font-size="68" font-weight="800" fill="#ffffff" text-anchor="start">L2SE</text>
<text x="60" y="145" font-size="30" font-weight="600" fill="#bfdbfe" text-anchor="start">Learner to Systems Engineer</text>
<text x="60" y="190" font-size="23" font-weight="400" fill="#e0f2fe" text-anchor="start">Mentor AI yang membuatmu bernalar seperti engineer, bukan sekadar menerima jawaban.</text>
<rect x="930" y="60" width="210" height="54" rx="27" fill="#1d4ed8" stroke="#93c5fd" stroke-width="2"/>
<text x="1035" y="95" font-size="21" font-weight="700" fill="#ffffff" text-anchor="middle">STEM untuk semua</text>
<rect x="40" y="238" width="8" height="40" rx="4" fill="#be123c"/>
<text x="62" y="268" font-size="32" font-weight="700" fill="#0f172a" text-anchor="start">Masalah yang diselesaikan</text>
<rect x="40" y="300" width="545" height="128" rx="14" fill="#fff1f2" stroke="#fda4af" stroke-width="2"/>
<circle cx="76" cy="338" r="20" fill="#be123c"/>
<text x="76" y="346" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle">1</text>
<text x="110" y="346" font-size="24" font-weight="700" fill="#881337" text-anchor="start">AI biasa memberi jawaban instan</text>
<text x="64" y="384" font-size="20" font-weight="400" fill="#475569" text-anchor="start">Cepat selesai, tetapi pemahaman dangkal</text>
<text x="64" y="412" font-size="20" font-weight="400" fill="#475569" text-anchor="start">dan membuat kita bergantung.</text>
<rect x="615" y="300" width="545" height="128" rx="14" fill="#fff1f2" stroke="#fda4af" stroke-width="2"/>
<circle cx="651" cy="338" r="20" fill="#be123c"/>
<text x="651" y="346" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle">2</text>
<text x="685" y="346" font-size="24" font-weight="700" fill="#881337" text-anchor="start">Penjelasan tidak mengenal kamu</text>
<text x="639" y="384" font-size="20" font-weight="400" fill="#475569" text-anchor="start">Level, latar belakang, dan targetmu diabaikan:</text>
<text x="639" y="412" font-size="20" font-weight="400" fill="#475569" text-anchor="start">terlalu sulit atau terlalu mudah.</text>
<rect x="40" y="448" width="545" height="128" rx="14" fill="#fff1f2" stroke="#fda4af" stroke-width="2"/>
<circle cx="76" cy="486" r="20" fill="#be123c"/>
<text x="76" y="494" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle">3</text>
<text x="110" y="494" font-size="24" font-weight="700" fill="#881337" text-anchor="start">Rumus dihafal, bukan dipahami</text>
<text x="64" y="532" font-size="20" font-weight="400" fill="#475569" text-anchor="start">Sulit memecahkan masalah baru karena tidak</text>
<text x="64" y="560" font-size="20" font-weight="400" fill="#475569" text-anchor="start">tahu asal-usul dan alasannya.</text>
<rect x="615" y="448" width="545" height="128" rx="14" fill="#fff1f2" stroke="#fda4af" stroke-width="2"/>
<circle cx="651" cy="486" r="20" fill="#be123c"/>
<text x="651" y="494" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle">4</text>
<text x="685" y="494" font-size="24" font-weight="700" fill="#881337" text-anchor="start">Ilmu cepat lupa dan tercecer</text>
<text x="639" y="532" font-size="20" font-weight="400" fill="#475569" text-anchor="start">Tanpa catatan dan pengulangan, progres tidak</text>
<text x="639" y="560" font-size="20" font-weight="400" fill="#475569" text-anchor="start">terlihat dan tidak bisa dipamerkan.</text>
<rect x="40" y="596" width="545" height="128" rx="14" fill="#fff1f2" stroke="#fda4af" stroke-width="2"/>
<circle cx="76" cy="634" r="20" fill="#be123c"/>
<text x="76" y="642" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle">5</text>
<text x="110" y="642" font-size="24" font-weight="700" fill="#881337" text-anchor="start">Guru kewalahan menyiapkan materi</text>
<text x="64" y="680" font-size="20" font-weight="400" fill="#475569" text-anchor="start">Satu guru, banyak murid: waktu terbatas untuk</text>
<text x="64" y="708" font-size="20" font-weight="400" fill="#475569" text-anchor="start">materi, soal, dan umpan balik per murid.</text>
<rect x="615" y="596" width="545" height="128" rx="14" fill="#fff1f2" stroke="#fda4af" stroke-width="2"/>
<circle cx="651" cy="634" r="20" fill="#be123c"/>
<text x="651" y="642" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle">6</text>
<text x="685" y="642" font-size="24" font-weight="700" fill="#881337" text-anchor="start">Sumber terbaik dunia sulit diakses</text>
<text x="639" y="680" font-size="20" font-weight="400" fill="#475569" text-anchor="start">Buku, paper, dan kuliah terbuka umumnya</text>
<text x="639" y="708" font-size="20" font-weight="400" fill="#475569" text-anchor="start">berbahasa asing, tanpa pendamping.</text>
<rect x="40" y="754" width="8" height="40" rx="4" fill="#0f766e"/>
<text x="62" y="784" font-size="32" font-weight="700" fill="#0f172a" text-anchor="start">Cara L2SE menjawabnya</text>
